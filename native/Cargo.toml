[package]
name = "aho-corasick-node-rs"
version = "0.1.9"
authors = ["Vladimir Skvortsov <vlad@whereto.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "aho_corasick_node_rs"
crate-type = ["cdylib"]

[dependencies]
# Node-API: one binary per platform works on every Node version (no per-ABI builds).
neon = { version = "1.1", default-features = false, features = ["napi-6"] }
# Kept on 0.7 (locked 0.7.18) so match semantics stay identical to 0.1.8.
aho-corasick = "0.7.6"
